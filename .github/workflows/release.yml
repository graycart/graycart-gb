name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio/input libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag must match Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag crate=$ver"
          test "$tag" = "$ver"
      - name: Release build
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Pack artifact
        run: |
          ver="${GITHUB_REF_NAME#v}"
          name="graycart-${ver}-${{ matrix.target }}"
          mkdir -p dist
          if [ -f "target/${{ matrix.target }}/release/graycart.exe" ]; then
            cp "target/${{ matrix.target }}/release/graycart.exe" "dist/${name}.exe"
            file="${name}.exe"
          else
            cp "target/${{ matrix.target }}/release/graycart" "dist/${name}"
            chmod +x "dist/${name}"
            file="${name}"
          fi
          export FILE="$file"
          python - <<'PY'
          import hashlib, pathlib, os
          dist = pathlib.Path("dist")
          name = os.environ["FILE"]
          data = (dist / name).read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          (dist / f"{name}.sha256").write_text(f"{digest}  {name}\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: graycart-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
