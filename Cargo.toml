[package]
name = "graycart"
version = "0.11.5"
edition = "2024"

[dependencies]
cpal = "0.15"
dirs = "6"
egui = "0.34"
egui-wgpu = "0.34"
egui-winit = { version = "0.34", default-features = false, features = ["links"] }
gilrs = "0.11"
pixels = "0.17"
png = "0.17"
pollster = "0.4"
rfd = "0.17"
rtrb = "0.3"
crc32fast = "1"
postcard = { version = "1", features = ["alloc"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
winit = "0.30"
ureq = { version = "2.12", features = ["json"] }
open = "5"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
coreaudio-sys = "0.2"

[dev-dependencies]
tempfile = "3"
